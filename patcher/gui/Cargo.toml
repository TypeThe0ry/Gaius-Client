[workspace]
resolver = "2"

[package]
name = "gaius-builder"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[dependencies]
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "default_fonts", "system_fonts", "wgpu", "x11", "wayland"] }
egui_kittest = { version = "=0.37.0", features = ["eframe", "wgpu", "snapshot"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std"] }
encoding_rs = "0.8"
rfd = { version = "0.15.4", default-features = false, features = ["async-std", "xdg-portal"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
