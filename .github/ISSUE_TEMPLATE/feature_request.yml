name: Feature request
description: Suggest an idea or improvement
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Read the [issue rules](https://github.com/TypeThe0ry/Gaius-Client/blob/main/CONTRIBUTING.md) first. Requests for downloads or builds are closed.
  - type: checkboxes
    id: rules
    attributes:
      label: Before you post
      options:
        - label: This is not a request for a download, a build or a hosted copy.
          required: true
        - label: This request contains no game files, builds, decompiled game code, or links to them.
          required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful
  - type: dropdown
    id: profile
    attributes:
      label: Minecraft profile
      options: ["Any", "26.3", "26.2", "1.21.11"]
