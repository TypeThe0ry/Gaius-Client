name: Bug report
description: Something does not work or behaves differently from the Java Edition
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not attach game files, builds or links to them.
        感谢反馈。请不要附带游戏文件、构建产物或相关链接。
  - type: dropdown
    id: profile
    attributes:
      label: Minecraft profile
      options: ["26.3", "26.2", "1.21.11", "Not sure"]
    validations:
      required: true
  - type: dropdown
    id: form
    attributes:
      label: How do you run it
      options: ["Website", "Single-file page (file://)", "Not sure"]
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Graphics backend (F3 debug screen)
      options: ["WebGPU", "WebGL2", "Not sure"]
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Chrome 155 on Windows 11"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device / GPU / RAM
      placeholder: "Desktop, RTX 4060, 16 GB"
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a new world ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console log / screenshots
      description: Browser console output (F12 → Console) or screenshots, if available.
