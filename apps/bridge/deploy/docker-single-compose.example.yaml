name: gaius-relaynode

services:
  relaynode:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${GAIUS_DOCKER_IMAGE:-gaius-relaynode:current}
    container_name: ${GAIUS_DOCKER_CONTAINER:-gaius-relaynode}
    restart: unless-stopped
    env_file:
      - ./docker-single.env
    ports:
      - "127.0.0.1:${GAIUS_DOCKER_HOST_PORT:-18080}:8080"
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8080/health').then(r =>
          process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
