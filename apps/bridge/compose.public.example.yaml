name: gaius-public-relay

services:
  gaius-registry:
    build: .
    command: ["node", "dist/registry.js"]
    restart: unless-stopped
    environment:
      GAIUS_REGISTRY_HOST: "0.0.0.0"
      GAIUS_REGISTRY_PORT: "8083"
      GAIUS_REGISTRY_TOKEN: "${GAIUS_REGISTRY_TOKEN:?set GAIUS_REGISTRY_TOKEN}"
      GAIUS_REGISTRY_LEASE_MS: "90000"
      GAIUS_REGISTRY_MAXIMUM_NODES: "256"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8083/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  gaius-relay:
    build: .
    restart: unless-stopped
    depends_on:
      gaius-registry:
        condition: service_healthy
    environment:
      GAIUS_BRIDGE_HOST: "0.0.0.0"
      GAIUS_BRIDGE_PORT: "8080"
      GAIUS_ALLOWED_ORIGINS: "${GAIUS_ALLOWED_ORIGINS:?set GAIUS_ALLOWED_ORIGINS}"
      GAIUS_ALLOWED_HOSTS: "*"
      GAIUS_ALLOW_PRIVATE_TARGETS: "0"
      GAIUS_ALLOWED_RESOURCE_PACK_HOSTS: "*"
      GAIUS_CONNECT_TIMEOUT_MS: "10000"
      GAIUS_MAXIMUM_CONNECTIONS: "${GAIUS_MAXIMUM_CONNECTIONS:-256}"
      GAIUS_TARGET_AFFINITY_MS: "300000"
      GAIUS_MAXIMUM_TARGET_ROUTES: "4096"
      GAIUS_RESOURCE_PACK_CACHE_MS: "300000"
      GAIUS_RESOURCE_PACK_CACHE_BYTES: "536870912"
      GAIUS_RESOURCE_PACK_CACHE_ENTRIES: "64"
      GAIUS_RESOURCE_PACK_BODY_IDLE_TIMEOUT_MS: "30000"
      GAIUS_RESOURCE_PACK_STREAM_OVERALL_TIMEOUT_MS: "600000"
      GAIUS_RELAY_NODE_NAME: "${GAIUS_RELAY_NODE_NAME:?set GAIUS_RELAY_NODE_NAME}"
      GAIUS_RELAY_NODE_ID: "${GAIUS_RELAY_NODE_ID:?set GAIUS_RELAY_NODE_ID}"
      GAIUS_RELAY_PUBLIC_URL: "wss://${GAIUS_RELAY_DOMAIN:?set GAIUS_RELAY_DOMAIN}/tunnel"
      GAIUS_RELAY_PRIORITY: "${GAIUS_RELAY_PRIORITY:-0}"
      GAIUS_RELAY_REGISTRY_URL: "http://gaius-registry:8083/relay-registry/v1/nodes/"
      GAIUS_RELAY_REGISTRY_TOKEN: "${GAIUS_REGISTRY_TOKEN:?set GAIUS_REGISTRY_TOKEN}"
      # The lease write stays inside the private Compose network.
      GAIUS_RELAY_ALLOW_INSECURE_REGISTRATION: "1"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      gaius-relay:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      GAIUS_REGISTRY_DOMAIN: "${GAIUS_REGISTRY_DOMAIN:?set GAIUS_REGISTRY_DOMAIN}"
      GAIUS_RELAY_DOMAIN: "${GAIUS_RELAY_DOMAIN:?set GAIUS_RELAY_DOMAIN}"
    volumes:
      - ./Caddyfile.public.example:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
