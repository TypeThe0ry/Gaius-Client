services:
  gaius-registry:
    build: .
    command: ["node", "dist/registry.js"]
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      GAIUS_REGISTRY_HOST: "0.0.0.0"
      GAIUS_REGISTRY_PORT: "8083"
      GAIUS_REGISTRY_TOKEN: "replace-with-the-same-long-random-registry-token"
      GAIUS_REGISTRY_LEASE_MS: "90000"
      GAIUS_REGISTRY_MAXIMUM_NODES: "256"

  gaius-translator:
    build: .
    restart: unless-stopped
    depends_on:
      - gaius-registry
    ports:
      - "8080:8080"
    environment:
      GAIUS_ALLOWED_ORIGINS: "https://play.example,null"
      GAIUS_ALLOWED_HOSTS: "*"
      GAIUS_ALLOW_PRIVATE_TARGETS: "0"
      GAIUS_ALLOWED_RESOURCE_PACK_HOSTS: "cdn.example.net,gitlab.com"
      GAIUS_MAXIMUM_CONNECTIONS: "256"
      GAIUS_TARGET_AFFINITY_MS: "300000"
      GAIUS_MAXIMUM_TARGET_ROUTES: "4096"
      GAIUS_RESOURCE_PACK_CACHE_MS: "300000"
      GAIUS_RESOURCE_PACK_CACHE_BYTES: "536870912"
      GAIUS_RESOURCE_PACK_CACHE_ENTRIES: "64"
      GAIUS_RELAY_NODE_NAME: "Example Gaius Translator"
      GAIUS_RELAY_NODE_ID: "example-translator-1"
      GAIUS_RELAY_PUBLIC_URL: "wss://relay.example/tunnel"
      GAIUS_RELAY_PRIORITY: "0"
      GAIUS_RELAY_REGISTRY_URL: "http://gaius-registry:8083/relay-registry/v1/nodes/"
      GAIUS_RELAY_REGISTRY_TOKEN: "replace-with-the-same-long-random-registry-token"
      # Safe only because this HTTP request stays on the private compose network.
      GAIUS_RELAY_ALLOW_INSECURE_REGISTRATION: "1"
